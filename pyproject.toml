[tool.poetry]
name = "personal-portfolio-api"
version = "0.1.0"
description = "A Flask REST API for managing user information in a personal portfolio application."
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
flask = "^2.0"
flask-restful = "^0.3.9"
marshmallow = "^3.0"
sqlalchemy = "^1.4"
python-dotenv = "^0.19"
pytest = "^6.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = [
    "tests",
]